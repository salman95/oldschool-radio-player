services:
  radio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radio-app
    # Must match the owner of ./data on the host (`id -u` / `id -g`)
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${PORT:-6767}:6767"
    environment:
      - NODE_ENV=production
      # The app always listens on 6767 inside the container; PORT only changes the host port
      - PORT=6767
      - DB_PATH=/app/data/radio.db
      - TZ=${TZ:-UTC}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./music:/app/music:ro
      - news-audio:/app/public/news
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:6767', r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  news-audio:
